name: Windows tests and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=4
      - run: npm run build
      - run: npm run lint
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check version tag
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Version tag does not match application version' }
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - name: Publish installer and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one installer' }
          $checksum = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $files[0].Name
          $checksum | Set-Content SHA256.txt -Encoding ascii
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already published; preserving verified assets.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME $files[0].FullName SHA256.txt --verify-tag --title "DersPusulası $env:GITHUB_REF_NAME" --notes 'Windows uygulama güncellemesi. İlk çevrimdışı kurulum için ayrıca tam paket gerekir. Güncellemeden önce öğrenci yedeği alın.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
